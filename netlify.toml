[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Security headers for the Netlify frontend
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' https://www.jatekvezeto.hu blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"

# Proxy API & Admin-uploaded video/PDF endpoints to your Render Java backend (keeps auth cookies same-site)
[[redirects]]
  from = "/api/*"
  to = "https://fiba-referee-backend.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for client-side routes (/study, /rulebook, /admin, /login, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
