[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy API & video/PDF endpoints to your Render Java backend (keeps auth cookies same-site)
[[redirects]]
  from = "/api/*"
  to = "https://fiba-referee-backend.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for client-side routes (/study, /rulebook, /admin, /login, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
