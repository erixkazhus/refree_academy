server:
  port: ${PORT:8080}
  max-http-request-header-size: 8KB
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    max-connections: 1000
    threads:
      max: 100
      min-spare: 10
    connection-timeout: 5s
    keep-alive-timeout: 15s
    max-keep-alive-requests: 100
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

spring:
  application:
    name: fiba-referee-academy
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fiba_referee_db}
    username: ${SPRING_DATASOURCE_USERNAME:fiba_app}
    password: ${SPRING_DATASOURCE_PASSWORD:ChangeMeStrongDbPass!2026}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:FibaRefAcademySuperSecretSigningKeyMustBeAtLeast64BytesLong2026!}
    expiration-seconds: 86400
    cookie-name: FIBA_REF_TOKEN
    cookie-secure: ${APP_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  video:
    storage-dir: ${APP_VIDEO_STORAGE_DIR:./uploads/videos}
    seed-dir: ${APP_VIDEO_SEED_DIR:../media/seed-videos}
  pdf:
    dir: ${APP_PDF_DIR:../media/rulebook-pdfs}
  rate-limit:
    auth-requests-per-minute: 10
    heavy-requests-per-minute: 90
    api-requests-per-minute: 240
    media-requests-per-minute: 450
  seed:
    admin-email: ${APP_SEED_ADMIN_EMAIL:admin@fibaref.org}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:AdminFiba#2026!}
